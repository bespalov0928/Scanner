<style>
    th {
        position: sticky;
        top: 0;
        background-color: #fff; /* Чтобы заголовки были четко видны против контента */
    }
</style>
<!--<div class="container p-3 ">-->
<div class="container-fluid ">
    <div class="row">
        <div class="col-12">
            <div class="table-responsive">
                <form th:action="@{/update}" method="post" enctype="multipart/form-data" th:object="${indexDto}">
                    <div class="d-flex flex-row">
                        <ul class="nav">
                            <li class="nav-item">
                                <button type="submit" class="btn btn-primary">Обновить</button>
                            </li>
                            <li class="nav-item">
                                <b>Пара:</b>
                                <input name="сoinPair" id="сoinPair" th:field="*{сoinPair}"/>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/chainTwoCoin}">Поиск связки</a>
                            </li>
                        </ul>
                    </div>
                    <div style="max-height: 900px; overflow: auto;">
<!--                    <div style="overflow: auto;">-->
                        <table class="table table-bordered table-hover" style="width: 100%;">
                            <thead>
                            <tr>
                                <th>Пара</th>
                                <th><a class="nav-link" th:href="@{/form/bybit}">Bybit</a></th>
                                <th><a class="nav-link" th:href="@{/form/okx}">Okx</a></th>
                                <th><a class="nav-link" th:href="@{/form/bitget}">Bitget</a></th>
                                <th><a class="nav-link" th:href="@{/form/bingx}">Bingx</a></th>
                                <th><a class="nav-link" th:href="@{/form/kucoin}">Kucoin</a></th>
                                <th><a class="nav-link" th:href="@{/form/huobi}">Huobi</a></th>
                                <th><a class="nav-link" th:href="@{/form/mexc}">Mexc</a></th>
                                <th><a class="nav-link" th:href="@{/form/coinw}">CoinW</a></th>
                                <th><a class="nav-link" th:href="@{/form/gate}">Gate</a></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="tk:${indexDto.listPrice}">
                                <td><a th:text="${tk.symbol}"></a></td>
                                <td><a th:text="${tk.priceBybitText}"></a></td>
                                <td><a th:text="${tk.priceOkxText}"></a></td>
                                <td><a th:text="${tk.priceBitgetText}"></a></td>
                                <td><a th:text="${tk.priceBingxText}"></a></td>
                                <td><a th:text="${tk.priceKucoinText}"></a></td>
                                <td><a th:text="${tk.priceHuobiText}"></a></td>
                                <td><a th:text="${tk.priceMexcText}"></a></td>
                                <td><a th:text="${tk.priceCoinWText}"></a></td>
                                <td><a th:text="${tk.priceGateText}"></a></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>

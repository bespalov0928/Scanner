<div class="container p-3">
    <div class="row">
        <div class="col-12">
            <div class="table-responsive">
                <form th:action="@{/chain/update}" method="post" enctype="multipart/form-data"
                      th:object="${arrayChain}">
                    <div class="d-flex flex-row">
                        <ul class="nav">
                            <li class="nav-item">
                                <button type="submit" class="btn btn-primary">Обновить</button>
                            </li>
                            <li class="nav-item">
                                <b>Пара:</b>
                                <input name="symbol" id="symbol" th:field="*{сoinPair}"/>
                            </li>
                            <li class="nav-item">
                                <b>Спред:</b>
                                <input name="spred" id="spred" th:field="*{spred}"/>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/index}">Главная страница</a>
                            </li>
                        </ul>
                    </div>

                    <table class="table table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>Биржа</th>
                            <th>Пара</th>
                            <th>Bybit</th>
                            <th>Okx</th>
                            <th>Bitget</th>
                            <th>Bingx</th>
                            <th>Kucoin</th>
                            <th>Huobi</th>
                            <th>Mexc</th>
                            <th>CoinW</th>
                            <th>Gate</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="tk:${arrayChain.listChain_v2}">
                            <td><a th:text="${tk.exchange}"/></td>
                            <td><a th:text="${tk.symbol}"/></td>
                            <td><a th:text="${tk.bybit}"/></td>
                            <td><a th:text="${tk.okx}"/></td>
                            <td><a th:text="${tk.bitget}"/></td>
                            <td><a th:text="${tk.bingx}"/></td>
                            <td><a th:text="${tk.kucoin}"/></td>
                            <td><a th:text="${tk.huobi}"/></td>
                            <td><a th:text="${tk.mexc}"/></td>
                            <td><a th:text="${tk.coinw}"/></td>
                            <td><a th:text="${tk.gate}"/></td>
                        </tr>
                        </tbody>
                    </table>
                </form>
            </div>
        </div>
    </div>
</div>
</div>

</body>

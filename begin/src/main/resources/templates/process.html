<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
            integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
            integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
            crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
            integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
            crossorigin="anonymous"></script>
    <title>Process</title>
</head>
<body>
<div class="container p-3">
    <div class="table-responsive">
        <!--        <table class="table table-bordered table-hover">-->
        <form th:action="@{/process/update}" method="get" enctype="multipart/form-data" th:object="${delta}">
            <div class="d-flex flex-row">
                <ul class="nav">
                    <li class="nav-item">
                        <button type="submit" class="btn btn-primary">Обновить</button>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/index}">Главная страница</a>
                    </li>
                </ul>
            </div>
            <table class="table table-bordered table-hover">
                <thead>
                <tr>
                    <th>Пара</th>
                    <th>Bybit</th>
                    <th>Okx</th>
                    <th>Bitget</th>
                    <th>Bingx</th>
                    <th>Kucoin</th>
                    <th>Huobi</th>
                    <th>Mexc</th>
                    <th>CoinW</th>
                    <th>Gate</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tk:${delta}">
                    <td><a th:text="${tk.symbol}"/></td>
                    <td><a th:text="${tk.bybit}"/></td>
                    <td><a th:text="${tk.okx}"/></td>
                    <td><a th:text="${tk.bitget}"/></td>
                    <td><a th:text="${tk.bingx}"/></td>
                    <td><a th:text="${tk.kucoin}"/></td>
                    <td><a th:text="${tk.huobi}"/></td>
                    <td><a th:text="${tk.mexc}"/></td>
                    <td><a th:text="${tk.coinw}"/></td>
                    <td><a th:text="${tk.gate}"/></td>
                </tr>
                </tbody>
            </table>
        </form>
    </div>
</div>

</body>
</html>

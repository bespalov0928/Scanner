management:
  #  + Мониторинг сервисов с Micrometer и VictoriaMetrics
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
    #  - Мониторинг сервисов с Micrometer и VictoriaMetrics
    metrics:
      tags:
        application: sanbox
      export:
        prometheus:
          enabled: true
    prometheus:
      enabled=true:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0